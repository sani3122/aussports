name: Scrape LiveSportsOnTV Schedule BD

on:
  schedule:
    - cron: '0 */3 * * *'  # Runs every 3 hours
  workflow_dispatch:        # Allows manual run from GitHub interface or cron-job.org

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python LiveOnTv.py

      - name: Commit and Push Updated Schedule
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add liveonsat_schedule_bd.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update liveonsat schedule [skip ci]" && git push)
          
